<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Miele Integration for Home Assistant">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2001A"/>
      <stop offset="100%" stop-color="#6E0000"/>
    </linearGradient>
    <pattern id="stripes" width="42" height="42" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="42" height="42" fill="transparent"/>
      <rect width="10" height="42" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#stripes)"/>

  <text x="70" y="185" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="#ffffff">Miele</text>
  <text x="74" y="228" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff" opacity="0.92">für Home Assistant</text>
  <text x="74" y="278" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff" opacity="0.8">Wasserverbrauch &#183; Energieverbrauch &#183; Live-Status</text>

  <rect x="70" y="308" width="480" height="2" fill="#ffffff" opacity="0.25"/>

  <!-- water droplet -->
  <g transform="translate(920,110)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" opacity="0.10"/>
    <path d="M0,-28 C17,-7 28,10 28,25 C28,42 15,54 0,54 C-15,54 -28,42 -28,25 C-28,10 -17,-7 0,-28 Z" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- energy bolt -->
  <g transform="translate(1050,110)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" opacity="0.10"/>
    <path d="M6,-32 L-20,9 L-2,9 L-6,32 L22,-7 L4,-7 Z" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- washing drum -->
  <g transform="translate(985,255)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" opacity="0.10"/>
    <circle cx="0" cy="0" r="33" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.92"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.75"/>
    <circle cx="-22" cy="-22" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="22" cy="-22" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
